<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promaco SpA - Acceso al Sistema</title>
    <!-- Bootstrap 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilo_login.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- NAVBAR SUPERIOR CON TEXTURA Y LOGO -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-secondary py-3 border-bottom border-dark">
        <div class="container-fluid px-4">
            <a class="navbar-brand m-0 p-0" href="index.html">
             <img src="img/promaco_logo_transparente.png" alt="Logo Promaco SpA" style="height: 38px; width: auto;">
            </a>
        </div>
    </nav>

    <!-- CONTENIDO CENTRAL: FONDO DE ALTA PRESENCIA -->
    <main class="container d-flex flex-column justify-content-center align-items-center my-auto py-5">
        <div class="card p-4 p-md-5 border-0 text-dark" style="width: 100%; max-width: 420px;">
            <div class="text-center mb-4">
                <h2 class="fw-bold text-dark">Iniciar Sesion</h2>
                <p class="text-muted small">Gestion y Proyectos de Construccion</p>
            </div>

            <!-- Formulario de Inicio de Sesion -->
            <form id="form-login" novalidate>
                <div class="mb-3">
                    <label for="email" class="form-label small fw-bold text-secondary">Correo Electrónico</label>
                    <input type="text" class="form-control" id="email" placeholder="tucorreo@duoc.cl">
                    <div class="form-text">Solo correos @duoc.cl, @profesor.duoc.cl o @gmail.com.</div>
                    <div class="invalid-feedback d-block text-danger small" id="email-error"></div>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label small fw-bold text-secondary">Contraseña</label>
                    <input type="password" class="form-control" id="password" placeholder="••••••••">
                    <div class="form-text">Entre 4 y 10 caracteres.</div>
                    <div class="invalid-feedback d-block text-danger small" id="password-error"></div>
                </div>
                <button type="submit" class="btn btn-dark w-100 py-2 fw-bold">Ingresar al Sistema</button>
                <div id="login-mensaje" class="mt-3"></div>
            </form>

            <!-- Link a registro -->
            <div class="text-center mt-4 pt-3 border-top">
                <span class="text-muted small">¿No tienes cuenta?</span>
                <a href="registro.html" class="small fw-semibold text-decoration-none">Registrate aqui</a>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="text-center py-4 mt-auto">
        <div class="container">
            <p class="mb-0 small">🏗️ Constructora Promaco SpA - Todos los derechos reservados</p>
        </div>
    </footer>

    <!-- Bootstrap Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/validaciones.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
