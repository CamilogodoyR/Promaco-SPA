<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promaco SpA - Registro de Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilo_login.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Navbar con color sólido (sin texturas) y logo con tamaño controlado -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-secondary py-3 border-bottom border-dark">
        <div class="container-fluid px-4">
            <a class="navbar-brand m-0 p-0" href="index.html">
             <img src="img/promaco_logo_transparente.png" alt="Logo Promaco SpA" style="height: 38px; width: auto;">
            </a>
        </div>
    </nav>


<main class="container d-flex flex-column justify-content-center align-items-center my-auto py-5">
    <div class="card p-4 p-md-5 border-0 text-dark" style="width: 100%; max-width: 460px;">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-dark">Crear cuenta</h2>
            <p class="text-muted small">Regístrate para comprar en Promaco SpA</p>
        </div>

        <form id="form-registro" novalidate>
            <div class="mb-3">
                <label for="reg-nombre" class="form-label small fw-bold text-secondary">Nombre completo</label>
                <input type="text" class="form-control" id="reg-nombre" maxlength="50">
                <div class="invalid-feedback d-block text-danger small" id="reg-nombre-error"></div>
            </div>
            <div class="mb-3">
                <label for="reg-rut" class="form-label small fw-bold text-secondary">RUT (sin puntos ni guion)</label>
                <input type="text" class="form-control" id="reg-rut" placeholder="19011022K">
                <div class="invalid-feedback d-block text-danger small" id="reg-rut-error"></div>
            </div>
            <div class="mb-3">
                <label for="reg-email" class="form-label small fw-bold text-secondary">Correo electrónico</label>
                <input type="text" class="form-control" id="reg-email" placeholder="tucorreo@duoc.cl">
                <div class="form-text">Solo @duoc.cl, @profesor.duoc.cl o @gmail.com.</div>
                <div class="invalid-feedback d-block text-danger small" id="reg-email-error"></div>
            </div>
            <div class="mb-4">
                <label for="reg-clave" class="form-label small fw-bold text-secondary">Contraseña</label>
                <input type="password" class="form-control" id="reg-clave">
                <div class="form-text">Entre 4 y 10 caracteres.</div>
                <div class="invalid-feedback d-block text-danger small" id="reg-clave-error"></div>
            </div>
            <button type="submit" class="btn btn-dark w-100 py-2 fw-bold">Registrarme</button>
            <div id="reg-mensaje" class="mt-3"></div>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
            <span class="text-muted small">¿Ya tienes cuenta?</span>
            <a href="index.html" class="small fw-semibold text-decoration-none">Inicia sesión</a>
        </div>
    </div>
</main>

<footer class="text-center py-4 mt-auto">
    <div class="container"><p class="mb-0 small">🏗️ Constructora Promaco SpA - Todos los derechos reservados</p></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/validaciones.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const form = document.getElementById("form-registro");
        const nombre = document.getElementById("reg-nombre");
        const rut = document.getElementById("reg-rut");
        const email = document.getElementById("reg-email");
        const clave = document.getElementById("reg-clave");
        const mensaje = document.getElementById("reg-mensaje");

        form.addEventListener("submit", (e) => {
            e.preventDefault();
            let ok = true;

            if (nombre.value.trim() === "") { mostrarError("reg-nombre-error", "El nombre es obligatorio."); ok = false; }
            else { limpiarError("reg-nombre-error"); }

            if (!rutValido(rut.value.trim())) { mostrarError("reg-rut-error", "RUT inválido: sin puntos ni guion, entre 7 y 9 caracteres."); ok = false; }
            else { limpiarError("reg-rut-error"); }

            if (!correoValido(email.value.trim())) { mostrarError("reg-email-error", "Solo se aceptan correos @duoc.cl, @profesor.duoc.cl o @gmail.com."); ok = false; }
            else { limpiarError("reg-email-error"); }

            if (!claveValida(clave.value)) { mostrarError("reg-clave-error", "La contraseña debe tener entre 4 y 10 caracteres."); ok = false; }
            else { limpiarError("reg-clave-error"); }

            if (!ok) { mensaje.innerHTML = ""; return; }

            mensaje.innerHTML = "<p class='text-success small'>¡Cuenta creada con éxito! Ya puedes iniciar sesión.</p>";
            form.reset();
        });
    });
</script>
</body>
</html>
