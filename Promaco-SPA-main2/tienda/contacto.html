<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promaco SpA - Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../estilo_login.css">
</head>
<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-secondary py-3 border-bottom border-dark">
        <div class="container-fluid px-4">
            <a class="navbar-brand m-0 p-0" href="home.html">
                <img src="../img/promaco_logo_transparente.png" alt="Logo Promaco SpA" style="height: 38px; width: auto;">
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavPrivado">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavPrivado">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center gap-lg-3">
                    <li class="nav-item"><a class="nav-link text-light" href="home.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link text-light active" href="catalogo.html">Catálogo</a></li>
                    <li class="nav-item"><a class="nav-link text-light" href="noticias.html">Noticias</a></li>
                    <li class="nav-item"><a class="nav-link text-light" href="contacto.html">Contacto</a></li>
                    <li class="nav-item"><a class="nav-link text-warning fw-bold" href="carrito.html">🛒 Carrito</a></li>
                    <li class="nav-item ms-lg-3">
                        <a href="../index.html" class="btn btn-danger btn-sm px-3">Cerrar Sesión</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

<main class="container py-5 my-auto" style="max-width: 560px;">
    <div class="card p-4 text-dark">
        <h1 class="h3 fw-bold text-center mb-4">Contáctanos</h1>
        <form id="form-contacto" novalidate>
            <div class="mb-3">
                <label for="c-nombre" class="form-label small fw-bold">Nombre completo *</label>
                <input type="text" class="form-control" id="c-nombre" placeholder="Nombre y apellido" maxlength="100">
                <div class="text-danger small" id="c-nombre-error"></div>
            </div>
            <div class="mb-3">
                <label for="c-telefono" class="form-label small fw-bold">Teléfono *</label>
                <input type="text" class="form-control" id="c-telefono" placeholder="+56 9 ...">
                <div class="text-danger small" id="c-telefono-error"></div>
            </div>
            <div class="mb-3">
                <label for="c-email" class="form-label small fw-bold">Correo electrónico *</label>
                <input type="text" class="form-control" id="c-email" placeholder="tucorreo@ejemplo.cl">
                <div class="text-danger small" id="c-email-error"></div>
            </div>
            <div class="mb-3">
                <label for="c-direccion" class="form-label small fw-bold">Dirección del trabajo *</label>
                <input type="text" class="form-control" id="c-direccion" placeholder="Calle, número, comuna" maxlength="200">
                <div class="text-danger small" id="c-direccion-error"></div>
            </div>
            <div class="mb-3">
                <label for="c-mensaje" class="form-label small fw-bold">Descripción breve del trabajo *</label>
                <textarea class="form-control" id="c-mensaje" rows="4" maxlength="500" placeholder="Cuéntanos qué necesitas: tipo de trabajo, tamaño, plazos, etc."></textarea>
                <div class="text-danger small" id="c-mensaje-error"></div>
            </div>
            <button type="submit" class="btn btn-dark w-100 fw-bold">Enviar solicitud</button>
            <div id="c-respuesta" class="mt-3"></div>
        </form>
    </div>
</main>

<footer class="text-center py-4 mt-auto">
    <div class="container"><p class="mb-0 small">🏗️ Constructora Promaco SpA - Todos los derechos reservados</p></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/validaciones.js"></script>
<script>
    document.getElementById("form-contacto").addEventListener("submit", function (e) {
        e.preventDefault();
        const nombre = document.getElementById("c-nombre");
        const telefono = document.getElementById("c-telefono");
        const email = document.getElementById("c-email");
        const direccion = document.getElementById("c-direccion");
        const mensajeTxt = document.getElementById("c-mensaje");
        let ok = true;

        // Nombre completo: obligatorio
        if (nombre.value.trim() === "") { mostrarError("c-nombre-error", "El nombre es obligatorio."); ok = false; }
        else { limpiarError("c-nombre-error"); }

        // Teléfono: obligatorio, solo números, +, espacios y guiones (mínimo 8 dígitos)
        const soloDigitos = telefono.value.replace(/[^0-9]/g, "");
        if (telefono.value.trim() === "") { mostrarError("c-telefono-error", "El teléfono es obligatorio."); ok = false; }
        else if (soloDigitos.length < 8) { mostrarError("c-telefono-error", "Ingresa un teléfono válido (mínimo 8 dígitos)."); ok = false; }
        else { limpiarError("c-telefono-error"); }

        // Correo: obligatorio y con dominio permitido (usa correoValido de validaciones.js)
        if (email.value.trim() === "") { mostrarError("c-email-error", "El correo es obligatorio."); ok = false; }
        else if (!correoValido(email.value.trim())) { mostrarError("c-email-error", "Solo se aceptan correos @duoc.cl, @profesor.duoc.cl o @gmail.com."); ok = false; }
        else { limpiarError("c-email-error"); }

        // Dirección del trabajo: obligatoria
        if (direccion.value.trim() === "") { mostrarError("c-direccion-error", "La dirección es obligatoria."); ok = false; }
        else { limpiarError("c-direccion-error"); }

        // Descripción del trabajo: obligatoria, máximo 500 caracteres
        if (mensajeTxt.value.trim() === "") { mostrarError("c-mensaje-error", "La descripción es obligatoria."); ok = false; }
        else if (mensajeTxt.value.length > 500) { mostrarError("c-mensaje-error", "Máximo 500 caracteres."); ok = false; }
        else { limpiarError("c-mensaje-error"); }

        if (!ok) return;

        document.getElementById("c-respuesta").innerHTML = "<p class='text-success small'>¡Gracias! Recibimos tu solicitud y te contactaremos pronto.</p>";
        this.reset();
    });
</script>
</body>
</html>
