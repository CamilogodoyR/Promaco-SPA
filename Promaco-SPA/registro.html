<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Configuracion general y metadatos -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promaco SpA - Registro de Usuario</title>
    <!-- Bootstrap 5.3.3 y estilos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilo_login.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-dark text-light">

<!-- Barra de navegacion principal -->
<nav class="navbar navbar-expand-lg navbar-dark bg-secondary py-3 border-bottom border-dark">
    <div class="container-fluid px-4">
        <a class="navbar-brand m-0 p-0 navbar-brand-logo d-flex align-items-center gap-2" href="index.html">
            <img src="img/promaco_logo_transparente.png" alt="Logo Promaco SpA" style="height: 38px; width: auto;">
            <span class="text-white fw-bold">Promaco SpA</span>
        </a>
    </div>
</nav>

<!-- Contenedor principal de registro -->
<main class="container d-flex flex-column justify-content-center align-items-center my-auto py-5">
    <div class="card p-4 p-md-5 border-0 text-dark shadow bg-light" style="width: 100%; max-width: 460px;">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-dark">Crear cuenta</h2>
            <p class="text-muted small">Registrate para comprar en Promaco SpA</p>
        </div>

        <!-- Formulario de registro -->
        <form id="form-registro" novalidate>
            <div class="mb-3">
                <label for="reg-nombre" class="form-label small fw-bold text-secondary">Nombre completo</label>
                <input type="text" class="form-control" id="reg-nombre" maxlength="50">
                <div class="invalid-feedback d-block text-danger small" id="reg-nombre-error"></div>
            </div>
            <div class="mb-3">
                <label for="reg-rut" class="form-label small fw-bold text-secondary">RUT (sin puntos ni guion)</label>
                <input type="text" class="form-control" id="reg-rut" placeholder="19011022K">
                <div class="invalid-feedback d-block text-danger small" id="reg-rut-error"></div>
            </div>
            <div class="mb-3">
                <label for="reg-email" class="form-label small fw-bold text-secondary">Correo electronico</label>
                <input type="text" class="form-control" id="reg-email" placeholder="tucorreo@duoc.cl">
                <div class="form-text">Solo dominios permitidos.</div>
                <div class="invalid-feedback d-block text-danger small" id="reg-email-error"></div>
            </div>
            <div class="mb-4">
                <label for="reg-clave" class="form-label small fw-bold text-secondary">Contrasena</label>
                <input type="password" class="form-control" id="reg-clave">
                <div class="form-text">Entre 4 y 10 caracteres.</div>
                <div class="invalid-feedback d-block text-danger small" id="reg-clave-error"></div>
            </div>
            <button type="submit" class="btn btn-dark w-100 py-2 fw-bold">Registrarme</button>
            <div id="reg-mensaje" class="mt-3"></div>
        </form>

        <!-- Enlace para volver al login -->
        <div class="text-center mt-4 pt-3 border-top">
            <span class="text-muted small">¿Ya tienes cuenta?</span>
            <a href="index.html" class="small fw-semibold text-decoration-none">Inicia sesion</a>
        </div>
    </div>
</main>

<!-- Pie de pagina institucional -->
<footer class="text-center py-4 mt-auto bg-black text-muted">
    <div class="container"><p class="mb-0 small">🏗️ Constructora Promaco SpA - Todos los derechos reservados</p></div>
</footer>

<!-- Scripts de Bootstrap y logica de validacion -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/validaciones.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const form = document.getElementById("form-registro");
        const nombre = document.getElementById("reg-nombre");
        const rut = document.getElementById("reg-rut");
        const email = document.getElementById("reg-email");
        const clave = document.getElementById("reg-clave");
        const mensaje = document.getElementById("reg-mensaje");

        // Evento de envio y validaciones del formulario
        form.addEventListener("submit", (e) => {
            e.preventDefault();
            let ok = true;

            if (nombre.value.trim() === "") { mostrarError("reg-nombre-error", "El nombre es obligatorio."); ok = false; }
            else { limpiarError("reg-nombre-error"); }

            if (!rutValido(rut.value.trim())) { mostrarError("reg-rut-error", "RUT invalido."); ok = false; }
            else { limpiarError("reg-rut-error"); }

            if (!correoValido(email.value.trim())) { mostrarError("reg-email-error", "Correo no valido."); ok = false; }
            else { limpiarError("reg-email-error"); }

            if (!claveValida(clave.value)) { mostrarError("reg-clave-error", "Contrasena no valida."); ok = false; }
            else { limpiarError("reg-clave-error"); }

            if (!ok) { mensaje.innerHTML = ""; return; }

            mensaje.innerHTML = "<p class='text-success small'>¡Cuenta creada con exito! Ya puedes iniciar sesion.</p>";
            form.reset();
        });
    });
</script>
</body>
</html>
