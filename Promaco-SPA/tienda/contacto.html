    <link rel="stylesheet" href="../estilo_login.css">
</head>

            <span class="navbar-toggler-icon"></span>

<!-- Contenedor del formulario de contacto -->
<main class="container py-5 my-auto" style="max-width: 560px;">
    <div class="card p-4 text-dark shadow bg-light">
        <h1 class="h3 fw-bold text-center mb-4">Contactanos</h1>
        <form id="form-contacto" novalidate>
            <div class="mb-3">
                <label for="c-nombre" class="form-label small fw-bold">Nombre completo *</label>
                <input type="text" class="form-control" id="c-nombre" placeholder="Nombre y apellido" maxlength="100">
                <div class="text-danger small" id="c-nombre-error"></div>
            </div>
            <div class="mb-3">
                <label for="c-telefono" class="form-label small fw-bold">Telefono *</label>
                <input type="text" class="form-control" id="c-telefono" placeholder="+56 9 ...">
                <div class="text-danger small" id="c-telefono-error"></div>
            </div>
            <div class="mb-3">
                <label for="c-email" class="form-label small fw-bold">Correo electronico *</label>
                <input type="text" class="form-control" id="c-email" placeholder="tucorreo@ejemplo.cl">
                <div class="text-danger small" id="c-email-error"></div>
            </div>
            <div class="mb-3">
                <label for="c-direccion" class="form-label small fw-bold">Direccion del trabajo *</label>
                <input type="text" class="form-control" id="c-direccion" placeholder="Calle, numero, comuna" maxlength="200">
                <div class="text-danger small" id="c-direccion-error"></div>
            </div>
            <div class="mb-3">
                <label for="c-mensaje" class="form-label small fw-bold">Descripcion breve del trabajo *</label>
                <textarea class="form-control" id="c-mensaje" rows="4" maxlength="500" placeholder="Cuentanos que necesitas: tipo de trabajo, tamano, plazos, etc."></textarea>
                <div class="text-danger small" id="c-mensaje-error"></div>
            </div>
            <button type="submit" class="btn btn-dark w-100 fw-bold">Enviar solicitud</button>
            <div id="c-respuesta" class="mt-3"></div>
        </form>
    </div>
</main>

<!-- Pie de pagina institucional -->
<footer class="text-center py-4 mt-auto bg-black text-muted">
    <div class="container"><p class="mb-0 small">🏗️ Constructora Promaco SpA - Todos los derechos reservados</p></div>
</footer>

<!-- Scripts y logica de validacion -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/validaciones.js"></script>
<script>
    document.getElementById("form-contacto").addEventListener("submit", function (e) {
        e.preventDefault();
        const nombre = document.getElementById("c-nombre");
        const telefono = document.getElementById("c-telefono");
        const email = document.getElementById("c-email");
        const direccion = document.getElementById("c-direccion");
        const mensajeTxt = document.getElementById("c-mensaje");
        let ok = true;

        // Validacion de campos del formulario
        if (nombre.value.trim() === "") { mostrarError("c-nombre-error", "El nombre es obligatorio."); ok = false; }
        else { limpiarError("c-nombre-error"); }

        const soloDigitos = telefono.value.replace(/[^0-9]/g, "");
        if (telefono.value.trim() === "") { mostrarError("c-telefono-error", "El telefono es obligatorio."); ok = false; }
        else if (soloDigitos.length < 8) { mostrarError("c-telefono-error", "Ingresa un telefono valido (minimo 8 digitos)."); ok = false; }
        else { limpiarError("c-telefono-error"); }

        if (email.value.trim() === "") { mostrarError("c-email-error", "El correo es obligatorio."); ok = false; }
        else if (!correoValido(email.value.trim())) { mostrarError("c-email-error", "Solo se aceptan correos permitidos."); ok = false; }
        else { limpiarError("c-email-error"); }

        if (direccion.value.trim() === "") { mostrarError("c-direccion-error", "La direccion es obligatoria."); ok = false; }
        else { limpiarError("c-direccion-error"); }

        if (mensajeTxt.value.trim() === "") { mostrarError("c-mensaje-error", "La descripcion es obligatoria."); ok = false; }
        else if (mensajeTxt.value.length > 500) { mostrarError("c-mensaje-error", "Maximo 500 caracteres."); ok = false; }
        else { limpiarError("c-mensaje-error"); }

        if (!ok) return;

        document.getElementById("c-respuesta").innerHTML = "<p class='text-success small'>¡Gracias! Recibimos tu solicitud y te contactaremos pronto.</p>";
        this.reset();
    });
</script>
</body>
</html>
